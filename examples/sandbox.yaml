# Load with LOCAL_XDS_PATH. Sandbox workloadUid must match a Workload uid.
workloads:
- uid: cluster1//v1/Pod/default/local
  name: local
  namespace: default
  serviceAccount: default
  workloadIps: ["127.0.0.1"]
  protocol: TCP
  node: local
  network: ""
  services: {}

sandboxes:
- uid: workload:local
  workloadUid: cluster1//v1/Pod/default/local
  trafficPolicy:
    egress:
      rules:
      - action: Allow
        ports:
        - protocol: TCP
          range: {start: 8080, end: 8080}
  trafficPolicyRefs:
  - namespaces/default/trafficPolicies/local-egress

# Map keys are xDS resource names; Sandbox references determine evaluation order.
policies:
  namespaces/default/trafficPolicies/local-egress:
    egress:
      rules:
      - action: Deny
        ports:
        - protocol: TCP
          range: {start: 9999, end: 9999}
      - action: Allow
