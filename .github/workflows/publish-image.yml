name: Publish ztunnel image

# Publish default-branch commits for Agentio's immutable dependency BOM.
# The development environment needs Docker Hub and Agentio GitHub App credentials.
on:
  push:
    branches:
      - master
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ztunnel-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/openkruise/ztunnel

jobs:
  build:
    if: >-
      github.repository == 'openkruise/ztunnel' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            file_pattern: x86-64
            fips_directory: linux_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            file_pattern: aarch64
            fips_directory: linux_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ztunnel
        env:
          FIPS_DIRECTORY: ${{ matrix.fips_directory }}
          VERSION: ${{ github.sha }}
        run: |
          ./common/scripts/run.sh cargo \
            --config "env.BORING_BSSL_FIPS_PATH.value=\"/work/vendor/boringssl-fips/${FIPS_DIRECTORY}\"" \
            build --locked --release
      - name: Verify and stage native binary
        env:
          EXPECTED_PATTERN: ${{ matrix.file_pattern }}
          ARCH: ${{ matrix.arch }}
        run: |
          binary=out/rust/release/ztunnel
          file "$binary"
          file "$binary" | grep -F "$EXPECTED_PATTERN"
          install -D -m 0755 "$binary" "image-context/${ARCH}/ztunnel"
          docker build --file docker/Dockerfile.ztunnel \
            --build-arg "TARGETARCH=$ARCH" \
            --build-arg "ZTUNNEL_VERSION=$GITHUB_SHA" \
            --tag ztunnel-smoke image-context
          docker run --rm ztunnel-smoke version
      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ztunnel-${{ matrix.arch }}
          path: image-context/${{ matrix.arch }}/ztunnel
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ztunnel-amd64
          path: image-context/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ztunnel-arm64
          path: image-context/arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.HUB_KRUISE }}
      - name: Publish multi-platform image
        id: image
        run: |
          metadata="${RUNNER_TEMP}/ztunnel-image.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --file docker/Dockerfile.ztunnel \
            --build-arg "ZTUNNEL_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --metadata-file "$metadata" \
            --push image-context
          digest=$(jq -er '."containerimage.digest"' "$metadata")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable ztunnel digest: $digest" >&2
            exit 1
          fi
          echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

  notify-agentio:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - name: Create Agentio GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENTIO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIO_SYNC_APP_PRIVATE_KEY }}
          owner: openkruise
          repositories: agentio
          permission-contents: write
      - name: Notify Agentio of published image
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_SHA" \
            '{event_type: "dependency-released", client_payload: {
              component: "ztunnel", image: $image,
              source_repository: $repository, source_ref: $ref
            }}' > "${RUNNER_TEMP}/dependency-released.json"
          gh api --method POST repos/openkruise/agentio/dispatches \
            --input "${RUNNER_TEMP}/dependency-released.json"
