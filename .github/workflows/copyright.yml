name: copyright

on:
  pull_request:
  push:
    branches:
      - master
      - "release-*"

permissions:
  contents: read

jobs:
  copyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify upstream baseline
        run: git rev-parse --verify "1.29.5^{commit}"

      - name: Check copyright headers
        run: make BUILD_WITH_CONTAINER=0 lint-copyright-kruise COPYRIGHT_BASE=1.29.5
