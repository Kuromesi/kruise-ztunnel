name: cargo-deny

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  push:
    branches:
      - master
      - "release-*"
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check ${{ matrix.check }}
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check ${{ matrix.check }}
          arguments: --all-features
