syntax = "proto3";

package agentio.sandbox;

option go_package = "github.com/openkruise/agentio/api/sandbox/v1;sandboxv1";

// EgressRouting selects a path after TrafficPolicy permits the connection.
// Routing matches the original destination, before gateway redirection.
// Absent routing, an empty route list, or no matching route uses PASSTHROUGH.
// To require a gateway for all egress, end the list with a catch-all GATEWAY.
message EgressRouting {
  // First matching route wins, in control-plane order.
  repeated Route routes = 1;

  message Route {
    // Destination CIDRs and ports are ANDed; entries within each list are ORed.
    // An empty list is unconstrained. CIDRs are normalized by the control plane.
    repeated string match_cidrs = 1;
    // Exact destination ports as decimal strings in 1..65535.
    repeated string match_ports = 2;
    // Forwarding action for matching traffic.
    Action action = 3;
    // Required for GATEWAY, absent for PASSTHROUGH. An unavailable selected gateway
    // fails the connection; consumers must not fall back to PASSTHROUGH.
    GatewayAddress gateway = 4;
  }

  message GatewayAddress {
    // Gateway service name, e.g. egress-gateway.agentio-system.svc.cluster.local.
    string service = 1;
    // Gateway port.
    uint32 port = 2;
  }

  // Access denial belongs to TrafficPolicy, not routing.
  enum Action {
    // Continue normal forwarding without selecting an egress gateway.
    PASSTHROUGH = 0;
    GATEWAY = 1;
  }
}
