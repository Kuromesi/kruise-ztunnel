# Mixed UDP + SCTP in one rule.
# Expected: both UDP 53 and SCTP 5000 allowed, ICMP blocked
# Note: nft backend uses `th dport` (protocol-agnostic), works correctly.
#       iptables backend would only match the first protocol — known limitation.
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-mixed-proto
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - port: 53
        protocol: UDP
      - port: 5000
        protocol: SCTP
  ingress:
    rules:
    - action: allow
      ports:
      - port: 53
        protocol: UDP
