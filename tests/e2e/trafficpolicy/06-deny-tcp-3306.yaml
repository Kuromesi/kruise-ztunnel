# Deny TCP 3306 (MySQL).
# Expected: TCP 3306 blocked, other TCP/UDP/ICMP blocked (default deny)
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-deny-mysql
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: reject
      ports:
      - port: 3306
        protocol: TCP
