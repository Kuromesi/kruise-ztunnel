# Allow all TCP (no port specified).
# NOTE: control plane sends PortRange{start:0, end:0, protocol:TCP}
#       which means port=0 in RBAC matching. This is a known control
#       plane limitation — use explicit ports instead.
# Expected:
#   - DNS blocked (UDP, default deny)
#   - ICMP blocked (default deny)
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-allow-all-tcp
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - protocol: TCP
  ingress:
    rules:
    - action: allow
      ports:
      - protocol: TCP
