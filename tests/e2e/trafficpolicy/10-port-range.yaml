# Port range: UDP 5000-5100 + DNS.
# Expected: DNS works, port range rendered as 5000-5100
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-port-range
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - port: 5000
        endPort: 5100
        protocol: UDP
      - port: 53
        protocol: UDP
  ingress:
    rules:
    - action: allow
      ports:
      - port: 53
        protocol: UDP
