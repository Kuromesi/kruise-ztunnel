# Allow TCP 80 and 443 both directions.
# Expected:
#   - TCP 80/443 allowed by RBAC (userspace proxy handles TCP)
#   - DNS blocked (UDP, default deny in firewall)
#   - ICMP blocked (default deny in firewall)
#   - curl to hostname fails because DNS is blocked; use direct IP to verify TCP
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-allow-tcp-web
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - port: 80
        protocol: TCP
      - port: 443
        protocol: TCP
  ingress:
    rules:
    - action: allow
      ports:
      - port: 80
        protocol: TCP
      - port: 443
        protocol: TCP
