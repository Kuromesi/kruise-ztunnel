# 16 UDP ports (exceeds iptables multiport 15-port limit).
# Expected: nft handles this fine. iptables would fail iptables-restore.
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-many-ports
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - {port: 1, protocol: UDP}
      - {port: 2, protocol: UDP}
      - {port: 3, protocol: UDP}
      - {port: 4, protocol: UDP}
      - {port: 5, protocol: UDP}
      - {port: 6, protocol: UDP}
      - {port: 7, protocol: UDP}
      - {port: 8, protocol: UDP}
      - {port: 9, protocol: UDP}
      - {port: 10, protocol: UDP}
      - {port: 11, protocol: UDP}
      - {port: 12, protocol: UDP}
      - {port: 13, protocol: UDP}
      - {port: 14, protocol: UDP}
      - {port: 15, protocol: UDP}
      - {port: 16, protocol: UDP}
