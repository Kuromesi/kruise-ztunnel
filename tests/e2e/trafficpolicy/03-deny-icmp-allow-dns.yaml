# Combined: deny ICMP + allow DNS.
# Expected: DNS works, ICMP explicitly denied, other UDP blocked (default deny)
apiVersion: agents.kruise.io/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-combined
  namespace: default
spec:
  selector:
    matchLabels:
      app: sleep
  egress:
    rules:
    - action: allow
      ports:
      - port: 53
        protocol: UDP
    - action: reject
      ports:
      - protocol: ICMP
  ingress:
    rules:
    - action: allow
      ports:
      - port: 53
        protocol: UDP
